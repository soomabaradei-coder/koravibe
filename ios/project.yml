name: KoraVibe
options:
  bundleIdPrefix: org.koravibe
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: KoraVibe uses the microphone to show live stadium sound level. Audio is not saved or uploaded.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: KoraVibe
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.2.0'
targets:
  KoraVibe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.koravibe.prototype
    scheme:
      gatherCoverageData: false
